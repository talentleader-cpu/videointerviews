<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wexpand · Video Interviews</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0653A1; --navy-dark:#00415E; --orange:#F07E2E; --sky:#96D4E7; --teal:#00A0C1; --amber:#F7A700;
    --bg:#f6f8fa; --card:#ffffff; --border:#e3e8ee; --text:#16232e; --muted:#6b7c8c;
    --green:#178a56; --green-bg:#e6f6ee; --amber-bg:#fef3e0; --red:#c0392b; --red-bg:#fbeae8; --blue-bg:#eaf2fb;
    --radius:14px;
    --font-head:'Bebas Neue', 'Montserrat', sans-serif;
    --font-body:'Montserrat', -apple-system, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px}
  a{color:inherit}
  h1,h2,h3{font-family:var(--font-head);letter-spacing:.01em;font-weight:400}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #e5e9f0;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;padding:5px;box-sizing:border-box}
  .brand .mark svg,.brand .mark img{width:100%;height:100%}
  .brand .word{font-family:var(--font-head);font-size:20px;color:var(--navy);line-height:1;letter-spacing:.02em}
  .brand .sub{font-family:var(--font-body);font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
  .crumbs{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;flex:1;margin-left:8px}
  .crumbs b{color:var(--text);cursor:pointer;font-weight:600}
  .crumbs .sep{opacity:.4}
  .topbar .right{display:flex;align-items:center;gap:8px}
  .icon-btn{border:1px solid var(--border);background:#fff;border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--muted)}
  .icon-btn:hover{background:var(--blue-bg);color:var(--navy);border-color:var(--navy)}
  .who{font-size:12px;color:var(--muted);margin-right:2px}
  .btn-logout{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--muted);font-family:var(--font-body);font-weight:600}
  .btn-logout:hover{background:#f3f4f6}
  .wrap{max-width:1140px;margin:0 auto;padding:28px}
  .page-title{font-family:var(--font-head);font-size:30px;color:var(--navy-dark);margin:2px 0 2px;letter-spacing:.01em}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);border-radius:10px;font-size:13.5px;background:#fff;font-family:var(--font-body)}
  .search input:focus{outline:2px solid var(--sky)}
  .search::before{content:"";position:absolute;left:13px;top:50%;transform:translateY(-50%);width:14px;height:14px;border:2px solid var(--muted);border-radius:50%;opacity:.55}
  .search::after{content:"";position:absolute;left:22px;top:59%;width:6px;height:2px;background:var(--muted);opacity:.55;transform:rotate(45deg)}
  select.filter{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:13px;color:var(--text);font-family:var(--font-body)}
  /* Position list — clean rows, not kanban */
  .pos-list{display:flex;flex-direction:column;gap:10px}
  .pos-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .pos-row .pmain{flex:1;min-width:220px;cursor:pointer}
  .pos-row .ptitle{font-weight:700;font-size:15px}
  .pos-row .pclient{color:var(--muted);font-size:12.5px;margin-top:1px}
  .pos-row .pstats{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .chip.total{background:var(--blue-bg);color:var(--navy)}
  .chip.pending{background:var(--amber-bg);color:#946200}
  .chip.reviewed{background:#eef2f7;color:#475569}
  .chip.shortlisted{background:var(--green-bg);color:var(--green)}
  .chip.rejected{background:var(--red-bg);color:var(--red)}
  .pos-row .pactions{display:flex;gap:8px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--border);background:#fafbfc;font-weight:700}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f8fafc}
  .cand-name{font-weight:700}
  .cand-email{color:var(--muted);font-size:12px}
  .status-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .status-pill.pending{background:var(--amber-bg);color:#946200}
  .status-pill.reviewed{background:#eef2f7;color:#475569}
  .status-pill.shortlisted{background:var(--green-bg);color:var(--green)}
  .status-pill.rejected{background:var(--red-bg);color:var(--red)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:28px;margin-bottom:8px}
  .detail-layout{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media (max-width:860px){.detail-layout{grid-template-columns:1fr}}
  .qa-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .qa-card .qnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--blue-bg);color:var(--navy);font-size:11.5px;font-weight:800;margin-right:8px;font-family:var(--font-body)}
  .qa-card .qtext{font-weight:700;font-size:13.5px;margin-bottom:10px;display:flex;align-items:center}
  .qa-card video{width:100%;max-height:360px;border-radius:10px;background:#000;display:block}
  .qa-card .transcript{margin-top:10px;background:#fafbfc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.8px;line-height:1.55;color:#37454f}
  .qa-card .transcript .tlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:4px}
  .side-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .side-card h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .field select, .field textarea, .field input{width:100%;border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px;font-family:var(--font-body);background:#fff}
  .field textarea{min-height:80px;resize:vertical}
  .cand-meta-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--border)}
  .cand-meta-row:last-child{border-bottom:none}
  .cand-meta-row .k{color:var(--muted)}
  .action-row{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .btn{border:none;border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.12s;font-family:var(--font-body)}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-dark)}
  .btn-orange{background:var(--orange);color:#fff}
  .btn-orange:hover{background:#d96a1c}
  .btn-green{background:var(--green-bg);color:var(--green)}
  .btn-green:hover{background:#d5f0e2}
  .btn-red{background:var(--red-bg);color:var(--red)}
  .btn-red:hover{background:#f8d9d5}
  .btn-ghost{background:#f0f3f6;color:var(--text)}
  .btn-ghost:hover{background:#e3e9ee}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
  .btn-outline:hover{background:var(--blue-bg)}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:10px;font-weight:600}
  .back-link:hover{color:var(--navy)}
  .save-note{font-size:11.5px;color:var(--green);margin-top:6px;min-height:14px}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f6f8fa,#eaf2fb)}
  .login-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:38px 34px;width:350px;box-shadow:0 12px 34px rgba(6,83,161,.09)}
  .login-card .mark{width:56px;height:56px;border-radius:15px;background:#fff;border:1px solid #e5e9f0;display:flex;align-items:center;justify-content:center;margin-bottom:16px;padding:8px;box-sizing:border-box}
  .login-card .mark svg,.login-card .mark img{width:100%;height:100%}
  .login-card h1{font-size:22px;margin:0 0 4px;color:var(--navy-dark);font-family:var(--font-head);letter-spacing:.01em}
  .login-card p{color:var(--muted);font-size:12.5px;margin:0 0 22px}
  .login-card input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:13.5px;font-family:var(--font-body)}
  .login-card button{width:100%;padding:11px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;font-size:13.5px;font-family:var(--font-body)}
  .login-card button:hover{background:var(--navy-dark)}
  .login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px}
  .loader{text-align:center;padding:60px;color:var(--muted)}
  .src-tag{font-size:10.5px;color:var(--muted);background:#f0f3f6;padding:2px 8px;border-radius:6px;margin-left:6px;font-weight:600}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,30,50,.5);z-index:95;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:16px;width:min(480px,100%);padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
  .modal h3{margin:0 0 6px;font-size:19px;color:var(--navy-dark);font-family:var(--font-head);letter-spacing:.01em}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
  .modal .close{position:absolute}
  .linkbox{display:flex;gap:8px;align-items:center;background:#f6f8fa;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .linkbox input{flex:1;border:none;background:transparent;font-size:12.5px;color:var(--navy);font-family:var(--font-body)}
  .linkbox input:focus{outline:none}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .copy-note{font-size:11.5px;color:var(--green);min-height:14px;margin-top:2px}
</style>
</head>

function markSVG(){
  return '<img src="data:image/png;base64,' + LOGO_MARK_B64 + '" alt="wexpand" style="width:100%;height:100%;object-fit:contain;display:block" />';
}

const app = document.getElementById('app');

// ---------- SHARED / PUBLIC VIEW (no login) ----------
function checkPublicShare(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('share');
  if(token){ renderPublicShare(token); return true; }
  return false;
}
async function renderPublicShare(token){
  app.innerHTML = `
    <div class="topbar"><div class="brand"><span class="mark">${markSVG()}</span><div><div class="word">wexpand</div><div class="sub">Video Interviews</div></div></div></div>
    <div class="wrap" id="pubWrap"><div class="loader">Cargando entrevista…</div></div>`;
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/get-submission-by-token?token=' + encodeURIComponent(token), {
      headers: { 'apikey': SUPABASE_ANON_KEY }
    });
    const data = await res.json();
    const wrap = document.getElementById('pubWrap');
    if(!res.ok || data.error){
      wrap.innerHTML = `<div class="empty"><div class="big">${ic('lock',30)}</div>Este link ya no está disponible.</div>`;
      return;
    }
    const answers = (data.answers||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    wrap.innerHTML = `
      <div class="page-title">${esc(data.candidate_name||'Candidato')}</div>
      <div class="page-sub">${esc(cleanTitle(data.position_title||''))}${cleanClient(data.client_name||'')?(' · '+esc(cleanClient(data.client_name))):''} · ${fmtDate(data.created_at)}</div>
      <div>
        ${answers.length ? answers.map((a,i)=>`
          <div class="qa-card">
            <div class="qtext"><span class="qnum">${a.order||(i+1)}</span>${esc(a.question||'Pregunta')}</div>
            ${a.url ? `<video controls preload="metadata" src="${esc(a.url)}"></video>` : `<div class="empty" style="padding:20px">Sin video</div>`}
          </div>`).join('') : `<div class="empty"><div class="big">${ic('inbox',30)}</div>Esta entrevista no tiene respuestas registradas.</div>`}
      </div>`;
  }catch(e){
    document.getElementById('pubWrap').innerHTML = `<div class="empty"><div class="big">${ic('warn',30)}</div>No se pudo cargar la entrevista.</div>`;
  }
}

// ---------- AUTH ----------
async function boot(){
  if(checkPublicShare()) return;
  const {data} = await sb.auth.getSession();
  if(data.session){ currentUser = data.session.user; renderApp(); }
  else renderLogin();
}
function renderLogin(err){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="mark">${markSVG()}</div>
        <h1>Video Interviews</h1>
        <input id="liEmail" type="email" placeholder="correo@wexpandmx.com" autocomplete="username">
        <input id="liPass" type="password" placeholder="Contraseña" autocomplete="current-password">
        <button onclick="doLogin()">Entrar</button>
        <div class="login-err">${err?esc(err):''}</div>
      </div>
    </div>`;
  document.getElementById('liPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}
async function doLogin(){
  const email = document.getElementById('liEmail').value.trim();
  const password = document.getElementById('liPass').value;
  if(!email || !password) return renderLogin('Ingresa correo y contraseña.');
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error){ renderLogin('No se pudo iniciar sesión: ' + error.message); return; }
  currentUser = data.user;
  renderApp();
}
async function doLogout(){
  await sb.auth.signOut();
  currentUser = null;
  renderLogin();
}

// ---------- DATA ----------
// Supabase/PostgREST caps every response at 1000 rows by default, so with ~8k
// interview_submissions we must page through with .range() or we silently lose data.
async function fetchAllRows(table, cols, orderCol, ascending){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    let q = sb.from(table).select(cols).range(from, from+pageSize-1);
    if(orderCol) q = q.order(orderCol, {ascending: ascending!==false});
    const {data, error} = await q;
    if(error) throw error;
    all = all.concat(data||[]);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
async function loadAll(){
  const [subs, pos, kits, clients, settingsRes] = await Promise.all([
    fetchAllRows('interview_submissions', 'id,position_id,kit_id,candidate_name,candidate_email,candidate_phone,answers,status,source_ref,created_at,reviewer_notes,reviewed_by,reviewed_at,token', 'created_at', false),
    fetchAllRows('positions', 'id,title,client_id,created_at,clients(name)'),
    fetchAllRows('interview_kits', 'id,position_id,share_token,is_active,questions'),
    fetchAllRows('clients', 'id,name', 'name'),
    sb.from('app_settings').select('key,value').eq('key','careers_base_url').maybeSingle()
  ]);
  ALL_SUBS = subs;
  ALL_POS = {};
  pos.forEach(p=>{ ALL_POS[p.id] = {title:cleanTitle(p.title), client:cleanClient((p.clients&&p.clients.name)||''), client_id:p.client_id||'', created_at:p.created_at||null}; });
  ALL_KITS = {};
  kits.forEach(k=>{ ALL_KITS[k.position_id] = k; });
  ALL_CLIENTS = clients;
  CAREERS_URL = (settingsRes.data && settingsRes.data.value) || '';
}

function positionsSummary(){
  const byPos = {};
  ALL_SUBS.forEach(s=>{
    if(!s.position_id) return;
    if(!byPos[s.position_id]) byPos[s.position_id] = {total:0,pending:0,reviewed:0,shortlisted:0,rejected:0};
    byPos[s.position_id].total++;
    const st = s.status||'pending';
    if(byPos[s.position_id][st]!=null) byPos[s.position_id][st]++;
  });
  // include ALL positions that have a kit too, even with 0 submissions, so the invite link stays reachable
  const ids = new Set([...Object.keys(byPos), ...Object.keys(ALL_KITS)]);
  return Array.from(ids).map(pid=>({
    id: pid,
    title: (ALL_POS[pid]&&ALL_POS[pid].title) || 'Posición sin título',
    client: (ALL_POS[pid]&&ALL_POS[pid].client) || '',
    created_at: (ALL_POS[pid]&&ALL_POS[pid].created_at) || null,
    total:0,pending:0,reviewed:0,shortlisted:0,rejected:0,
    ...(byPos[pid]||{})
  // Las posiciones más recién creadas van hasta arriba; entre posiciones sin fecha (o igual), se ordena por actividad.
  })).sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0) || b.total - a.total || a.title.localeCompare(b.title));
}

function renderApp(){

    <div class="topbar">
      <div class="brand" onclick="goPositions()"><span class="mark">${markSVG()}</span><div><div class="word">wexpand</div><div class="sub">Video Interviews</div></div></div>

    </div>
    <div class="wrap" id="content"><div class="loader">Cargando…</div></div>
    <div id="modalRoot"></div>
  `;
  loadAll().then(()=>{
    // Deep link ?position=<id> — usado por el botón "🎥 Video entrevista" de una

function setCrumbs(parts){
  document.getElementById('crumbs').innerHTML = parts.map((p,i)=>{
    const sep = i>0 ? '<span class="sep">/</span>' : '';
    return sep + (p.onclick ? `<b onclick="${p.onclick}">${esc(p.label)}</b>` : `<span>${esc(p.label)}</span>`);
  }).join(' ');
}

// ---------- INVITE LINK (per position, like Hireflix "Link Público") ----------
async function openInviteLink(positionId){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${ic('link',18)} Link para candidatos</h3>
        <p>Generando…</p>
      </div>
    </div>`;
  let kit = ALL_KITS[positionId];
  if(!kit){
    const {data, error} = await sb.from('interview_kits').insert({ position_id: positionId, questions: [], settings:{readSecs:10,prepSecs:25,answerSecs:60,practiceCount:3}, created_by: currentUser.id }).select().single();
    if(error){ paintInviteError(error.message); return; }
    kit = data;
    ALL_KITS[positionId] = kit;
  }
  paintInviteLink(positionId, kit);
}
function paintInviteError(msg){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal"><h3>${ic('link',18)} Link para candidatos</h3><p style="color:var(--red)">No se pudo generar: ${esc(msg)}</p>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div></div>
    </div>`;
}
function paintInviteLink(positionId, kit){
  const pinfo = ALL_POS[positionId] || {title:'esta posición'};
  const hasCareers = true;
  const link = APP_BASE_URL + '/interview.html?k=' + kit.share_token;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${ic('link',18)} Link para candidatos — ${esc(pinfo.title)}</h3>
        ${hasCareers ? `
          <div class="linkbox"><input id="inviteLinkInput" readonly value="${esc(link)}"></div>
          <div class="modal-actions" style="justify-content:space-between">
            <span class="copy-note" id="inviteCopyNote"></span>
            <div style="display:flex;gap:8px">
              <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
              <button class="btn btn-primary" onclick="copyInviteLink()">Copiar link</button>
            </div>
          </div>
        ` : `
          <p style="color:var(--red)">Falta configurar la URL de tu sitio de Careers para poder generar el link. Usa el ícono de ajustes arriba a la derecha.</p>
          <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-primary" onclick="closeModal();openSettings()">Configurar ahora</button></div>
        `}
      </div>
    </div>`;
}
function copyInviteLink(){
  const input = document.getElementById('inviteLinkInput');
  input.select();
  navigator.clipboard.writeText(input.value).then(()=>{
    document.getElementById('inviteCopyNote').textContent = '✓ Copiado';
  }).catch(()=>{ document.getElementById('inviteCopyNote').textContent = 'Selecciona y copia manualmente'; });
}

// ---------- NUEVA POSICIÓN (solo para video-entrevistas, no toca RecruitCRM/Hireflix) ----------
function openNewPositionModal(prefill){
  prefill = prefill || {};
  const defaultClient = ALL_CLIENTS.find(c=>/sin cliente asignado/i.test(c.name));
  const selectedClientId = prefill.clientId || (defaultClient&&defaultClient.id) || '';
  NP_QUESTIONS = (prefill.questions && prefill.questions.length) ? prefill.questions.slice() : [''];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:520px">
        <h3>${ic('plus',18)} ${prefill.title ? 'Duplicar posición' : 'Nueva posición'}</h3>
        <div class="field"><label>Título de la posición</label><input id="npTitle" placeholder="Ej. Ejecutivo de ventas" value="${esc(prefill.title||'')}"></div>
        <div class="field"><label>Cliente</label>
          <select id="npClient">
            ${ALL_CLIENTS.map(c=>`<option value="${esc(c.id)}" ${c.id===selectedClientId?'selected':''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Preguntas de la entrevista</label>
          <div id="npQList"></div>
          <button type="button" class="btn btn-outline" style="margin-top:6px" onclick="npAddQuestion()">+ Agregar pregunta</button>
        </div>
        <div class="modal-actions" style="justify-content:space-between">
          <span class="copy-note" id="npNote"></span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveNewPosition()">Crear posición</button>
          </div>
        </div>
      </div>
    </div>`;
  paintNpQuestions();
}
function paintNpQuestions(){
  const box = document.getElementById('npQList');
  if(!box) return;
  box.innerHTML = NP_QUESTIONS.map((q,i)=>`
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input data-qidx="${i}" class="npQInput" value="${esc(q)}" placeholder="Pregunta ${i+1}" style="flex:1">
      <button type="button" class="btn btn-outline" onclick="npRemoveQuestion(${i})" ${NP_QUESTIONS.length<=1?'disabled':''}>✕</button>
    </div>`).join('');
  box.querySelectorAll('.npQInput').forEach(inp=>{
    inp.addEventListener('input', e=>{ NP_QUESTIONS[+e.target.dataset.qidx] = e.target.value; });
  });
}
function npAddQuestion(){ NP_QUESTIONS.push(''); paintNpQuestions(); }
function npRemoveQuestion(i){ if(NP_QUESTIONS.length<=1) return; NP_QUESTIONS.splice(i,1); paintNpQuestions(); }
async function saveNewPosition(){
  const title = document.getElementById('npTitle').value.trim();
  const clientId = document.getElementById('npClient').value;
  const note = document.getElementById('npNote');
  if(!title){ note.textContent='Falta el título.'; note.style.color='var(--red)'; return; }
  const questions = NP_QUESTIONS.map(q=>q.trim()).filter(Boolean).map((text,i)=>({order:i+1, lang:'es', text}));
  if(!questions.length){ note.textContent='Agrega al menos una pregunta.'; note.style.color='var(--red)'; return; }
  note.textContent='Creando…'; note.style.color='';
  const {data:posRow, error:e1} = await sb.from('positions').insert({ title, client_id: clientId, status:'open', openings:1, created_by: currentUser.id }).select().single();
  if(e1){ note.textContent='Error: '+e1.message; note.style.color='var(--red)'; return; }
  const {data:kitRow, error:e2} = await sb.from('interview_kits').insert({ position_id: posRow.id, questions, settings:{readSecs:10,prepSecs:25,answerSecs:60,practiceCount:3}, created_by: currentUser.id, is_active:true }).select().single();
  if(e2){ note.textContent='Posición creada, pero no se pudo crear el kit de preguntas: '+e2.message; note.style.color='var(--red)'; return; }
  const clientObj = ALL_CLIENTS.find(c=>c.id===clientId);
  ALL_POS[posRow.id] = { title: posRow.title, client:(clientObj&&clientObj.name)||'', client_id: clientId, created_at: posRow.created_at||new Date().toISOString() };
  ALL_KITS[posRow.id] = kitRow;
  closeModal();
  openInviteLink(posRow.id);
}

// ---------- DUPLICAR POSICIÓN ----------
function duplicatePosition(positionId){
  const pinfo = ALL_POS[positionId] || {};
  const kit = ALL_KITS[positionId];
  const questions = (kit && kit.questions && kit.questions.length)
    ? kit.questions.slice().sort((a,b)=>(a.order||0)-(b.order||0)).map(q=>q.text||'').filter(Boolean)
    : [''];
  openNewPositionModal({
    title: pinfo.title ? (pinfo.title + ' (copia)') : '',
    clientId: pinfo.client_id || '',
    questions: questions.length ? questions : ['']
  });
}

// ---------- ELIMINAR POSICIÓN (solo de Video Interviews: kit + entrevistas — la posición sigue en el CRM) ----------
function deletePosition(positionId){
  const pinfo = ALL_POS[positionId] || {title:'esta posición'};
  const subCount = ALL_SUBS.filter(s=>s.position_id===positionId).length;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${ic('trash',18)} Eliminar de Video Interviews</h3>
        <p>¿Eliminar ${subCount ? ('las '+subCount+' entrevista(s) en video de ') : 'las entrevistas en video de '}<b>${esc(pinfo.title)}</b>? No se puede deshacer.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-red" onclick="confirmDeletePosition('${positionId}')">Eliminar</button>
        </div>
        <div class="copy-note" id="delPosNote"></div>
      </div>
    </div>`;
}
async function confirmDeletePosition(positionId){
  const note = document.getElementById('delPosNote');
  note.textContent='Eliminando…'; note.style.color='';
  const {error:e1} = await sb.from('interview_submissions').delete().eq('position_id', positionId);
  if(e1){ note.textContent='Error: '+e1.message; note.style.color='var(--red)'; return; }
  const {error:e2} = await sb.from('interview_kits').delete().eq('position_id', positionId);
  if(e2){ note.textContent='Error: '+e2.message; note.style.color='var(--red)'; return; }
  ALL_SUBS = ALL_SUBS.filter(s=>s.position_id!==positionId);
  delete ALL_KITS[positionId];
  closeModal();
  goPositions();
}

// ---------- EDITAR PREGUNTAS (posiciones ya existentes con kit) ----------
async function openEditQuestionsModal(positionId){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:520px"><h3>${ic('edit',18)} Preguntas de la entrevista</h3><p>Cargando…</p></div>
    </div>`;
  let kit = ALL_KITS[positionId];
  if(!kit){
    const {data, error} = await sb.from('interview_kits').insert({ position_id: positionId, questions: [], settings:{readSecs:10,prepSecs:25,answerSecs:60,practiceCount:3}, created_by: currentUser.id }).select().single();
    if(error){ paintEqError(error.message); return; }
    kit = data;
    ALL_KITS[positionId] = kit;
  }
  EQ_POSITION_ID = positionId;
  // interview_kits.questions se guarda como [{order,lang,text}], no strings sueltos
  // (así lo espera interview.html en el sitio de Careers) — extraemos solo el texto para editar.
  EQ_QUESTIONS = (kit.questions && kit.questions.length) ? kit.questions.map(q=>(typeof q==='string')?q:(q.text||'')) : [''];
  paintEditQuestionsModal();
}
function paintEditQuestionsModal(){
  const pinfo = ALL_POS[EQ_POSITION_ID] || {title:''};
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:520px">
        <h3>${ic('edit',18)} Preguntas de la entrevista</h3>
        <p>Posición: <b>${esc(pinfo.title)}</b></p>
        <div id="eqList"></div>
        <button type="button" class="btn btn-outline" style="margin-top:6px" onclick="eqAddQuestion()">+ Agregar pregunta</button>
        <div class="modal-actions" style="justify-content:space-between">
          <span class="copy-note" id="eqNote"></span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveEditQuestions()">Guardar</button>
          </div>
        </div>
      </div>
    </div>`;
  paintEqQuestions();
}
function paintEqQuestions(){
  const box = document.getElementById('eqList');
  if(!box) return;
  box.innerHTML = EQ_QUESTIONS.map((q,i)=>`
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input data-qidx="${i}" class="eqQInput" value="${esc(q)}" placeholder="Pregunta ${i+1}" style="flex:1">
      <button type="button" class="btn btn-outline" onclick="eqRemoveQuestion(${i})" ${EQ_QUESTIONS.length<=1?'disabled':''}>✕</button>
    </div>`).join('');
  box.querySelectorAll('.eqQInput').forEach(inp=>{
    inp.addEventListener('input', e=>{ EQ_QUESTIONS[+e.target.dataset.qidx] = e.target.value; });
  });
}
function eqAddQuestion(){ EQ_QUESTIONS.push(''); paintEqQuestions(); }
function eqRemoveQuestion(i){ if(EQ_QUESTIONS.length<=1) return; EQ_QUESTIONS.splice(i,1); paintEqQuestions(); }
function paintEqError(msg){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal"><h3>${ic('edit',18)} Preguntas de la entrevista</h3><p style="color:var(--red)">No se pudo cargar: ${esc(msg)}</p>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div></div>
    </div>`;
}
async function saveEditQuestions(){
  const note = document.getElementById('eqNote');
  const questions = EQ_QUESTIONS.map(q=>q.trim()).filter(Boolean).map((text,i)=>({order:i+1, lang:'es', text}));
  if(!questions.length){ note.textContent='Agrega al menos una pregunta.'; note.style.color='var(--red)'; return; }
  note.textContent='Guardando…'; note.style.color='';
  const {data, error} = await sb.from('interview_kits').update({ questions }).eq('position_id', EQ_POSITION_ID).select().single();
  if(error){ note.textContent='Error: '+error.message; note.style.color='var(--red)'; return; }
  ALL_KITS[EQ_POSITION_ID] = data;
  note.textContent='✓ Guardado'; note.style.color='var(--green)';
  setTimeout(closeModal, 700);
}

// ---------- VIEW: CANDIDATES FOR A POSITION ----------

  state.view='candidates'; state.positionId=positionId; state.submissionId=null; state.statusFilter='';
  renderCandidates();
}

  const pinfo = ALL_POS[state.positionId] || {title:'Posición', client:''};

    {label:'Posiciones', onclick:'goPositions()'},

    <div class="toolbar">
      <div class="search"><input id="candSearch" placeholder="Buscar candidato…"></div>
      <select class="filter" id="statusFilter">

        <option value="pending">Pendiente</option>
        <option value="reviewed">Revisado</option>
        <option value="shortlisted">Preseleccionado</option>
        <option value="rejected">Rechazado</option>
      </select>
      <button class="btn btn-outline" onclick="openEditQuestionsModal('${state.positionId}')">${ic('edit',14)} Preguntas</button>
      <button class="btn btn-outline" onclick="openInviteLink('${state.positionId}')">${ic('link',14)} Link para candidatos</button>
      <button class="icon-btn" title="Duplicar posición" onclick="duplicatePosition('${state.positionId}')">${ic('duplicate')}</button>
      <button class="icon-btn" title="Eliminar entrevistas de esta posición" onclick="deletePosition('${state.positionId}')" style="color:var(--red)">${ic('trash')}</button>
    </div>
    <div id="candTableWrap"></div>
  `;
  document.getElementById('candSearch').addEventListener('input', paint);
  document.getElementById('statusFilter').addEventListener('change', paint);
  function paint(){
    const q = document.getElementById('candSearch').value.toLowerCase();
    const st = document.getElementById('statusFilter').value;
    let f = subs;
    if(q) f = f.filter(s=>(s.candidate_name+' '+s.candidate_email).toLowerCase().includes(q));
    if(st) f = f.filter(s=>(s.status||'pending')===st);
    paintCandTable(f);
  }
  paintCandTable(subs);
}
function paintCandTable(list){
  const wrap = document.getElementById('candTableWrap');
  if(!list.length){ wrap.innerHTML = `<div class="empty"><div class="big">${ic('eyeoff',30)}</div>No hay candidatos con ese filtro.</div>`; return; }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Candidato</th><th>Preguntas</th><th>Fecha</th><th>Fuente</th><th>Estatus</th><th></th></tr></thead>
      <tbody>
        ${list.map(s=>`
          <tr onclick="openSubmission('${s.id}')">
            <td><div class="cand-name">${esc(s.candidate_name||'Sin nombre')}</div><div class="cand-email">${esc(s.candidate_email||'')}</div></td>
            <td>${(s.answers||[]).length}</td>
            <td>${fmtDate(s.created_at)}</td>
            <td>${s.source_ref&&s.source_ref.startsWith('hireflix')?'Hireflix':'Wexpand'}</td>
            <td><span class="status-pill ${s.status||'pending'}">${statusLabel(s.status)}</span></td>
            <td style="width:34px"><button class="icon-btn" title="Eliminar esta entrevista" onclick="event.stopPropagation();deleteSubmission('${s.id}')" style="color:var(--red)">${ic('trash',14)}</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

// ---------- VIEW: CANDIDATE DETAIL ----------
function openSubmission(id){
  state.view='detail'; state.submissionId=id;
  renderDetail();
}
function renderDetail(){
  const s = ALL_SUBS.find(x=>x.id===state.submissionId);
  const pinfo = ALL_POS[s.position_id] || {title:'Posición', client:''};
  setCrumbs([
    {label:'Posiciones', onclick:'goPositions()'},
    {label: pinfo.title, onclick:`openPosition('${s.position_id}')`},
    {label: s.candidate_name||'Candidato'}
  ]);
  const answers = (s.answers||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="back-link" onclick="openPosition('${s.position_id}')">← ${esc(pinfo.title)}</div>
    <div class="page-title">${esc(s.candidate_name||'Candidato')}</div>
    <div class="page-sub">${esc(s.candidate_email||'')} ${s.candidate_phone?(' · '+esc(s.candidate_phone)):''}</div>
    <div class="detail-layout">
      <div>
        ${answers.length ? answers.map((a,i)=>`
          <div class="qa-card">
            <div class="qtext"><span class="qnum">${a.order||(i+1)}</span>${esc(a.question||'Pregunta')}</div>
            ${a.url ? `<video controls preload="metadata" src="${esc(a.url)}"></video>` : `<div class="empty" style="padding:20px">Sin video</div>`}
            <div class="transcript">
              <div class="tlabel">Transcripción${(a.detected_lang||a.lang)?(' · '+esc((a.detected_lang||a.lang)==='en'?'Inglés':'Español')):''}</div>
              ${a.transcription ? esc(a.transcription) : `<span style="color:var(--muted)">Aún no disponible.</span> <button class="icon-btn" title="Transcribir ahora" onclick="retranscribeSubmission('${s.id}', this)" style="margin-left:6px">${ic('repeat',13)} Transcribir</button>`}
            </div>
          </div>`).join('') : `<div class="empty"><div class="big">${ic('inbox',30)}</div>Esta entrevista no tiene respuestas registradas.</div>`}
      </div>
      <div>
        <div class="side-card">
          <h4>Evaluación</h4>
          <div class="field">
            <label>Estatus</label>
            <select id="revStatus">
              <option value="pending" ${s.status==='pending'||!s.status?'selected':''}>Pendiente</option>
              <option value="reviewed" ${s.status==='reviewed'?'selected':''}>Revisado</option>
              <option value="shortlisted" ${s.status==='shortlisted'?'selected':''}>Preseleccionado</option>
              <option value="rejected" ${s.status==='rejected'?'selected':''}>Rechazado</option>
            </select>
          </div>
          <div class="field">
            <label>Comentarios</label>
            <textarea id="revNotes" placeholder="Notas de la evaluación…">${esc(s.reviewer_notes||'')}</textarea>
          </div>
          <div class="action-row">
            <button class="btn btn-primary" onclick="saveReview()">Guardar</button>
            <button class="btn btn-green" onclick="quickAction('shortlisted')">Mover a preselección</button>
            <button class="btn btn-red" onclick="quickAction('rejected')">Rechazar</button>
          </div>
          <div class="save-note" id="saveNote"></div>
        </div>
        <div class="side-card">
          <h4>Detalles</h4>
          <div class="cand-meta-row"><span class="k">Posición</span><span>${esc(pinfo.title)}</span></div>
          <div class="cand-meta-row"><span class="k">Cliente</span><span>${esc(pinfo.client||'—')}</span></div>
          <div class="cand-meta-row"><span class="k">Entrevistado</span><span>${fmtDate(s.created_at)}</span></div>
          <div class="cand-meta-row"><span class="k">Última revisión</span><span>${s.reviewed_at?fmtDate(s.reviewed_at):'—'}</span></div>
          <div class="action-row" style="margin-top:12px">
            <button class="btn btn-outline" onclick="openShareSubmission('${s.id}')" style="width:100%">${ic('link',14)} Compartir esta entrevista</button>
          </div>
          <div class="action-row" style="margin-top:8px">
            <button class="btn btn-red" onclick="deleteSubmission('${s.id}')" style="width:100%">${ic('trash',14)} Eliminar esta entrevista</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

// ---------- ELIMINAR UNA ENTREVISTA/VIDEO INDIVIDUAL ----------
function deleteSubmission(id){
  const s = ALL_SUBS.find(x=>x.id===id);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${ic('trash',18)} Eliminar entrevista</h3>
        <p>¿Eliminar la entrevista de <b>${esc(s&&s.candidate_name||'este candidato')}</b>? No se puede deshacer.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-red" onclick="confirmDeleteSubmission('${id}')">Eliminar</button>
        </div>
        <div class="copy-note" id="delSubNote"></div>
      </div>
    </div>`;
}
async function confirmDeleteSubmission(id){
  const note = document.getElementById('delSubNote');
  note.textContent='Eliminando…'; note.style.color='';
  const s = ALL_SUBS.find(x=>x.id===id);
  const posId = s && s.position_id;
  const {error} = await sb.from('interview_submissions').delete().eq('id', id);
  if(error){ note.textContent='Error: '+error.message; note.style.color='var(--red)'; return; }
  ALL_SUBS = ALL_SUBS.filter(x=>x.id!==id);
  closeModal();
  if(posId) openPosition(posId); else goPositions();
}
async function saveReview(showQuick){
  const s = ALL_SUBS.find(x=>x.id===state.submissionId);
  const status = showQuick || document.getElementById('revStatus').value;
  const notes = document.getElementById('revNotes').value;
  const note = document.getElementById('saveNote');
  note.textContent = 'Guardando…'; note.style.color = 'var(--muted)';
  const {error} = await sb.from('interview_submissions').update({
    status, reviewer_notes: notes, reviewed_by: currentUser.id, reviewed_at: new Date().toISOString()
  }).eq('id', s.id);
  if(error){ note.textContent = 'Error al guardar: '+error.message; note.style.color = 'var(--red)'; return; }
  s.status = status; s.reviewer_notes = notes; s.reviewed_at = new Date().toISOString();
  note.textContent = '✓ Guardado'; note.style.color = 'var(--green)';
  renderDetail();
}
function quickAction(status){ saveReview(status); }

// ---------- SHARE ONE CANDIDATE'S INTERVIEW (like Hireflix "Compartir entrevista") ----------
function openShareSubmission(id){
  const s = ALL_SUBS.find(x=>x.id===id);
  const link = APP_BASE_URL + '?share=' + s.token;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${ic('link',18)} Compartir entrevista — ${esc(s.candidate_name||'este candidato')}</h3>
        <div class="linkbox"><input id="shareLinkInput" readonly value="${esc(link)}"></div>
        <div class="modal-actions" style="justify-content:space-between">
          <span class="copy-note" id="shareCopyNote"></span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
            <button class="btn btn-primary" onclick="copyShareLink()">Copiar link</button>
          </div>
        </div>
      </div>
    </div>`;
}
// Pide (o reintenta) la transcripción automática de una entrevista — detecta español/inglés solo.
// Solo se usa aquí, en el panel interno; nunca se muestra en la página pública del link del candidato.
async function retranscribeSubmission(id, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Transcribiendo…'; }
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/transcribe-submission', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ submission_id: id })
    });
    await res.json().catch(()=>({}));
    const {data} = await sb.from('interview_submissions').select('id,position_id,kit_id,candidate_name,candidate_email,candidate_phone,answers,status,source_ref,created_at,reviewer_notes,reviewed_by,reviewed_at,token').eq('id', id).single();
    if(data){
      const idx = ALL_SUBS.findIndex(x=>x.id===id);
      if(idx>-1) ALL_SUBS[idx] = data; else ALL_SUBS.push(data);
    }
  }catch(e){}
  if(state.submissionId===id) renderDetail();
}
function copyShareLink(){
  const input = document.getElementById('shareLinkInput');
  input.select();
  navigator.clipboard.writeText(input.value).then(()=>{
    document.getElementById('shareCopyNote').textContent = '✓ Copiado';
  }).catch(()=>{ document.getElementById('shareCopyNote').textContent = 'Selecciona y copia manualmente'; });
}

boot();
</script>

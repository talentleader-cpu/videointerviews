<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>Video Entrevista · Wexpand</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<style>
:root{--blue:#0653A1;--orange:#F07E2E;--sky:#96D4E7;--teal:#00A0C1;--navy:#00415E;--yellow:#F7A700;--green:#1ea672;--red:#c0505a;--ink:#0f2233;--muted:#5a6b78;--line:#e4ecf2;--bg:#eef4f9;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;}
.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;}
.wrap{max-width:720px;margin:0 auto;padding:0 18px;}
header.hero{background:linear-gradient(135deg,var(--navy),var(--blue) 70%,var(--teal));color:#fff;padding:20px 0;}
header.hero .wrap{display:flex;align-items:center;gap:12px;}
header.hero img.logo{height:30px;filter:brightness(0) invert(1);}
header.hero h1{font-size:22px;margin:0;letter-spacing:.5px;line-height:1;}
header.hero .sub{color:#cfe8f2;font-size:12.5px;margin:2px 0 0}
main{padding:22px 0 60px;min-height:60vh;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 22px rgba(0,40,80,.06);margin-bottom:16px;}
h2{color:var(--navy);margin:0 0 6px;font-size:21px;}
p.lead{color:var(--muted);margin:0 0 14px;}
label.fl{display:block;font-weight:700;color:var(--navy);font-size:13px;margin:12px 0 5px;}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;}
.rules{background:#f6faff;border:1px solid #dbe7fb;border-radius:12px;padding:14px 16px;margin:14px 0;}
.rules li{margin:6px 0;font-size:13.5px;color:#33506e;}
.chk{display:flex;gap:9px;align-items:flex-start;margin:14px 0 4px;font-size:13.5px;color:#33414d;cursor:pointer;}
.chk input{margin-top:3px;}
.btn{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:13px 22px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;}
.btn:hover{filter:brightness(1.05);} .btn:disabled{opacity:.45;cursor:default;}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
.btn.danger{background:var(--red);}
.btn.block{width:100%;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.err{color:var(--red);font-size:13.5px;margin-top:8px;min-height:1em;}
.gate-center{display:flex;align-items:center;justify-content:center;min-height:50vh;text-align:center;}
.gate-center .big{font-size:42px;margin-bottom:8px;}
.bglist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.bgopt{border:2.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:#fff;transition:border-color .15s;}
.bgopt.sel{border-color:var(--blue);}
.bgopt img{width:100%;height:110px;object-fit:cover;display:block;}
.bgopt .lbl{padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--navy);}
.bgopt.none{display:flex;align-items:center;justify-content:center;min-height:110px;flex-direction:column;gap:4px;color:var(--muted);grid-column:1/3;}
.bgopt .check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;}
.bgopt.sel .check{display:flex;}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#0b1c2b;border-radius:16px;overflow:hidden;max-width:480px;margin:0 auto;}
.stage video, .stage canvas{width:100%;height:100%;object-fit:cover;display:block;}
.stage .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:100px;font-weight:700;display:flex;align-items:center;gap:6px;}
.stage .badge .dot{width:8px;height:8px;border-radius:50%;background:#8bd18b;}
.stage .badge.rec .dot{background:#ff4d4f;animation:pulse 1s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.stage .timer{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:20px;padding:2px 12px;border-radius:100px;letter-spacing:1px;}
.stage .center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;font-size:14px;background:rgba(6,20,33,.55)}
.qbox{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:18px 20px;margin:16px auto;max-width:480px;text-align:center;}
.qbox .qnum{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--sky);display:block;margin-bottom:4px;}
.qbox .qtext{font-size:17px;font-weight:600;line-height:1.4;}
.progwrap{max-width:480px;margin:0 auto 14px;}
.prog{height:7px;background:#e0eaf2;border-radius:100px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--teal);border-radius:100px;transition:width .25s;}
.prog-lbl{font-size:11.5px;color:var(--muted);margin-top:5px;text-align:right;}
.center480{max-width:480px;margin:0 auto;}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 30px;}
.hidden{display:none !important;}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
.stepper{display:flex;align-items:center;justify-content:center;gap:0;margin:0 0 22px;max-width:520px;margin-left:auto;margin-right:auto;}
.stepper .stepitem{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
.stepper .stepitem .circ{width:30px;height:30px;border-radius:50%;background:#dbe4ec;color:#7c8a97;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:'Bebas Neue',sans-serif;transition:background .2s,color .2s;}
.stepper .stepitem.active .circ{background:var(--blue);color:#fff;}
.stepper .stepitem.done .circ{background:var(--teal);color:#fff;}
.stepper .stepitem .lbl{font-size:10.5px;font-weight:700;color:#8a97a3;text-align:center;white-space:nowrap;}
.stepper .stepitem.active .lbl{color:var(--navy);}
.stepper .line{flex:1;height:2px;background:#dbe4ec;margin:0 4px;margin-bottom:19px;min-width:14px;}
.stepper .line.done{background:var(--teal);}
.details-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start;}
@media (max-width:680px){.details-grid{grid-template-columns:1fr;}}
.details-left h2{font-size:26px;}
.details-left .kicker{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.howit{margin:16px 0;}
.howit .hstep{display:flex;gap:12px;align-items:flex-start;margin:14px 0;}
.howit .hnum{width:24px;height:24px;border-radius:50%;background:#e8f1fb;color:var(--blue);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.howit .htext b{color:var(--navy);}
.howit .htext .sub{color:var(--muted);font-size:12.5px;}
.timebox{display:flex;gap:18px;background:#f6faff;border:1px solid #dbe7fb;border-radius:12px;padding:12px 16px;margin-top:16px;font-size:12.5px;color:var(--navy);font-weight:700;flex-wrap:wrap;}
.consentline{font-size:12px;color:var(--muted);margin:12px 0 2px;}
.consentline a{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;}
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
.modal-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,20,50,.3);}
.modal-box h3{color:var(--navy);margin:0;padding:20px 22px 12px;font-size:19px;border-bottom:1px solid var(--line);}
.modal-body{padding:16px 22px;overflow-y:auto;font-size:13.5px;color:#33414d;line-height:1.6;}
.modal-body p{margin:0 0 12px;}
.modal-body b{color:var(--navy);}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
@keyframes spin{to{transform:rotate(360deg)}}
video.preview-plain{background:#0b1c2b;}
.thumb-name{font-weight:700;color:var(--navy)}
.step-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>

const STEP_LABELS = [
  {n:1,es:'Datos',en:'Details'},

  {n:4,es:'Entrevista',en:'Interview'}

function stepperHtml(active){
  return `<div class="stepper">${STEP_LABELS.map((s,i)=>{
    const cls = s.n===active ? 'active' : (s.n<active ? 'done' : '');
    const line = i>0 ? `<div class="line ${s.n<=active?'done':''}"></div>` : '';
    return line + `<div class="stepitem ${cls}"><div class="circ">${s.n<active?'✓':s.n}</div><div class="lbl">${state.lang==='en'?s.en:s.es}</div></div>`;
  }).join('')}</div>`;
}

  return `<div class="modal-overlay" id="consentOverlay" onclick="if(event.target.id==='consentOverlay')closeConsentModal()">

        <button class="btn" onclick="acceptConsent()">Acepto y continúo →</button>
      </div>
    </div>
  </div>`;
}
function openConsentModal(onAccept){
  consentOnAccept = onAccept || null;
  const wrap = document.createElement('div');
  wrap.id = 'consentModalWrap';
  wrap.innerHTML = consentModalHtml();
  document.body.appendChild(wrap);
}
function closeConsentModal(){
  const w = document.getElementById('consentModalWrap');
  if(w) w.remove();
  consentOnAccept = null;
}
function acceptConsent(){
  state.consentAccepted = true;
  const cb = consentOnAccept;
  closeConsentModal();
  if(cb) cb();
}

function $(id){ return document.getElementById(id); }

function app(){ return $('app'); }

// ---------------- INIT ----------------
(async function init(){
  if(!TOKEN){
    render('errorState', {title:'Link inválido', msg:'Falta el código de tu entrevista. Pide a tu reclutador el link correcto.'});
    return;
  }
  try{
    const {data, error} = await sb.rpc('get_interview_kit_public', {p_token: TOKEN});
    if(error) throw error;
    if(!data || !data.ok){
      render('errorState', {title:'Link no disponible', msg:(data&&data.message)||'Este link ya no está activo. Contacta a tu reclutador.'});
      return;
    }
    KIT = data;
    $('headerSub').textContent = (KIT.position_title||'') + (KIT.client_name?(' · '+KIT.client_name):'');
    LANGS = Array.from(new Set((KIT.questions||[]).map(q=>q.lang||'es')));
    if(!LANGS.length) LANGS=['es'];
    state.lang = LANGS.includes('es') ? 'es' : LANGS[0];
    setQuestionsForLang();
    render('welcome');
  }catch(e){
    render('errorState', {title:'No se pudo cargar', msg:'Error: '+(e.message||e)});
  }
})();

function setQuestionsForLang(){
  QUESTIONS = (KIT.questions||[]).filter(q=>(q.lang||'es')===state.lang).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  if(!QUESTIONS.length){
    QUESTIONS = (KIT.questions||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  }
}

// ---------------- ROUTER ----------------
function render(step, extra){
  state.step = step;
  stopSegLoop();
  if(step==='errorState') return renderError(extra);
  if(step==='welcome') return renderWelcome();
  if(step==='background') return renderBackground();
  if(step==='setup') return renderSetup();
  if(step==='practiceIntro') return renderPracticeIntro();
  if(step==='question') return renderQuestion();
  if(step==='uploading') return renderUploading();
  if(step==='done') return renderDone();
}

function renderError(extra){
  app().innerHTML = `<div class="gate-center"><div>
    <div class="big" style="color:var(--orange,#F07E2E)">${ic('warn',44)}</div>
    <h2>${esc(extra.title)}</h2>
    <p class="lead">${esc(extra.msg)}</p>
  </div></div>`;
}

        <p class="lead">Responderás algunas preguntas grabadas para la posición de <b>${esc(KIT.position_title)}</b>${KIT.client_name?(' en <b>'+esc(KIT.client_name)+'</b>'):''}, a tu propio ritmo.</p>
        <div class="howit">
          <div style="font-weight:800;color:var(--navy);font-size:13px;margin-bottom:4px">CÓMO FUNCIONA</div>
          <div class="hstep"><div class="hnum">1</div><div class="htext">${ic('book',15)} <b>Leer</b> · ${readS}s<div class="sub">Leerás cada pregunta en pantalla.</div></div></div>
          <div class="hstep"><div class="hnum">2</div><div class="htext">${ic('brain',15)} <b>Preparar</b> · ${prepS}s<div class="sub">Un momento para pensar tu respuesta.</div></div></div>
          <div class="hstep"><div class="hnum">3</div><div class="htext">${ic('cam',15)} <b>Grabar</b> · hasta ${ansS}s<div class="sub">Grabas tu respuesta en video.</div></div></div>
          <div class="hstep"><div class="hnum">4</div><div class="htext">${ic('repeat',15)} <b>Repetir</b> · 1 intento extra<div class="sub">Si no quedas conforme, puedes repetir.</div></div></div>
        </div>
        <div class="timebox">
          <div>${ic('clock',14)} <b>Tiempo estimado</b><br>${estMin}-${estMin+5} min</div>
          <div>${ic('clapper',14)} <b>Práctica incluida</b><br>Antes de empezar</div>
        </div>
      </div>
      <div class="card details-right">
        <h2 style="font-size:19px">Tus datos</h2>
        <p class="lead" style="margin-bottom:4px">Cuéntanos un poco sobre ti para empezar.</p>
        ${langPicker}
        <label class="fl">Nombre completo</label>
        <input type="text" id="fName" placeholder="Tu nombre" value="${esc(state.candidate.name)}">
        <label class="fl">Correo electrónico</label>
        <input type="email" id="fEmail" placeholder="tucorreo@ejemplo.com" value="${esc(state.candidate.email)}">
        <label class="fl">Teléfono (opcional)</label>
        <input type="tel" id="fPhone" placeholder="10 dígitos" value="${esc(state.candidate.phone)}">
        <p class="consentline">${ic('lock',12)} Tus respuestas son confidenciales y de uso interno. Al continuar aceptas nuestros <a onclick="openConsentModal(null)">Términos y aviso de privacidad</a>.</p>
        <div class="err" id="gateErr"></div>
        <button class="btn block" id="startBtn" onclick="submitGate()">Continuar →</button>
      </div>
    </div>`;
}
function pickLang(l){ state.lang = l; setQuestionsForLang(); renderWelcome(); }
function submitGate(){
  const name = $('fName').value.trim();
  const email = $('fEmail').value.trim();
  const phone = $('fPhone').value.trim();
  const err = $('gateErr');
  if(!name){ err.textContent='Escribe tu nombre.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Escribe un correo válido.'; return; }
  err.textContent='';
  state.candidate = {name, email, phone};
  if(!state.consentAccepted){
    openConsentModal(()=>{ render('background'); });
    return;
  }
  render('background');
}

    <div class="card">
      <h2>Elige un fondo para tu video</h2>
      <p class="lead">Para cuidar la privacidad de todos los candidatos, tu video se grabará con uno de nuestros fondos virtuales de Wexpand. Elige el que prefieras.</p>
      <div class="bglist">

function pickBg(b){ state.bg = b; renderBackground(); }

// ---------------- CAMERA SETUP ----------------
function renderSetup(){
  app().innerHTML = `
    ${stepperHtml(2)}
    <div class="card">
      <h2>Prueba tu cámara y micrófono</h2>
      <p class="lead">Verifica que se te vea y escuche bien antes de empezar.</p>
      <div class="stage" id="stage">
        <div class="center-msg" id="stageMsg">Solicitando acceso a tu cámara…</div>
      </div>
      <div class="err" id="setupErr" style="text-align:center"></div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn sec" onclick="stopCamera();render('background')">← Atrás</button>
        <button class="btn" id="setupContinue" style="flex:1" disabled onclick="render('practiceIntro')">Continuar →</button>
      </div>
    </div>`;
  startCamera();
}

async function startCamera(){
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:720},facingMode:'user'}, audio:true});
  }catch(e){
    $('stageMsg').textContent = 'No pudimos acceder a tu cámara/micrófono.';
    $('setupErr').textContent = 'Revisa los permisos del navegador y vuelve a intentar. ('+(e.message||e)+')';
    return;
  }
  mountStage();
  $('setupContinue').disabled = false;
}

function mountStage(){
  const stage = $('stage');
  if(!stage) return;
  stage.innerHTML = '';
  const video = document.createElement('video');
  video.id='camVideo'; video.autoplay=true; video.muted=true; video.playsInline=true; video.setAttribute('playsinline','');
  video.srcObject = cameraStream;
  video.play().catch(()=>{});
  if(state.bg==='none'){
    video.className='preview-plain';
    stage.appendChild(video);
  } else {
    // Keep the source <video> technically "visible" (not display:none) so Chrome keeps
    // decoding frames into it -- a hidden/display:none video can render black frames to canvas.
    video.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-9999px;';
    stage.appendChild(video);
    canvasEl = document.createElement('canvas');
    canvasEl.id='segCanvas';
    stage.appendChild(canvasEl);
    video.onloadedmetadata = ()=>{
      video.play().catch(()=>{});
      const track = cameraStream.getVideoTracks()[0];
      const s = track.getSettings ? track.getSettings() : {};
      canvasEl.width = Math.min(s.width||960, 960);
      canvasEl.height = Math.min(s.height||720, 720);
      canvasCtx = canvasEl.getContext('2d');
      bgImgEl = new Image();
      bgImgEl.src = BG_IMAGES[state.bg];
      startSegLoop(video);
    };
  }
}

function startSegLoop(video){
  if(!window.SelfieSegmentation){ drawFallback(video); return; }
  if(!segmenter){
    try{
      segmenter = new SelfieSegmentation({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
      segmenter.setOptions({modelSelection:1});
      segmenter.onResults(onSegResults);
    }catch(e){ segmenter=null; drawFallback(video); return; }
  }
  let running = true;
  segRAF = {stop:false};
  async function loop(){
    if(segRAF.stop) return;
    try{ await segmenter.send({image:video}); }
    catch(e){ /* ignore single-frame errors */ }
    requestAnimationFrame(loop);
  }
  loop();
}
function drawFallback(video){
  // no segmentation available: draw plain video frame into canvas (background image ignored)
  function loop(){
    if(!canvasCtx || !canvasEl) return;
    if(segRAF && segRAF.stop) return;
    canvasCtx.drawImage(video,0,0,canvasEl.width,canvasEl.height);
    requestAnimationFrame(loop);
  }
  segRAF = {stop:false};
  loop();
}
function onSegResults(results){
  if(!canvasCtx || !canvasEl) return;
  canvasCtx.save();
  canvasCtx.clearRect(0,0,canvasEl.width,canvasEl.height);
  canvasCtx.drawImage(results.segmentationMask,0,0,canvasEl.width,canvasEl.height);
  canvasCtx.globalCompositeOperation='source-in';
  canvasCtx.drawImage(results.image,0,0,canvasEl.width,canvasEl.height);
  canvasCtx.globalCompositeOperation='destination-over';
  if(bgImgEl && bgImgEl.complete){
    canvasCtx.drawImage(bgImgEl,0,0,canvasEl.width,canvasEl.height);
  } else {
    canvasCtx.fillStyle='#0653A1';
    canvasCtx.fillRect(0,0,canvasEl.width,canvasEl.height);
  }
  canvasCtx.restore();
}
function stopSegLoop(){
  if(segRAF) segRAF.stop = true;
  segRAF = null;
}
function stopCamera(){
  stopSegLoop();
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
}

// ---------------- PRACTICE ----------------
function renderPracticeIntro(){
  app().innerHTML = `
    ${stepperHtml(3)}
    <div class="card" style="text-align:center">
      <h2>${ic('clapper',20)} Ronda de práctica</h2>
      <p class="lead">Antes de empezar, haremos una pregunta de práctica para que te familiarices con la grabación. <b>Esta práctica no se guarda ni se envía.</b></p>
      <button class="btn block" onclick="beginPractice()">Empezar práctica →</button>
    </div>`;
}
function beginPractice(){
  state.qIndex = -1; // -1 signals practice
  state.attempts = 0;
  render('question');
}

// ---------------- QUESTION FLOW ----------------
function currentQuestionText(){
  if(state.qIndex === -1) return {text: state.lang==='en' ? 'Briefly introduce yourself: your name and what you do.' : 'Preséntate brevemente: tu nombre y a qué te dedicas.', order:0};
  return QUESTIONS[state.qIndex];
}
function maxAttempts(){ return state.qIndex===-1 ? 3 : 2; } // práctica: hasta 3 intentos; preguntas reales: 1 grabación + 1 reintento, por decisión de producto.

function renderQuestion(){
  const isPractice = state.qIndex === -1;
  const q = currentQuestionText();
  const total = QUESTIONS.length;
  const idxLabel = isPractice ? 'Práctica' : `Pregunta ${state.qIndex+1} de ${total}`;
  const pct = isPractice ? 0 : Math.round((state.qIndex/total)*100);
  app().innerHTML = `
    ${stepperHtml(isPractice?3:4)}
    ${!isPractice ? `<div class="progwrap"><div class="prog"><i style="width:${pct}%"></i></div><div class="prog-lbl">${idxLabel}</div></div>` : ''}
    <div class="qbox"><span class="qnum">${esc(idxLabel)}</span><span class="qtext">${esc(q.text)}</span></div>
    <div class="stage" id="stage"></div>
    <div class="err" id="qErr" style="text-align:center"></div>
    <div class="btnrow" id="qControls" style="justify-content:center"></div>
    <div class="step-note" id="stepNote"></div>`;
  mountStage();
  runReadPhase();
}

function runReadPhase(){
  clearTimeout(phaseTimer);
  const secs = (KIT.settings&&KIT.settings.readSecs)||10;
  paintStageBadge('Lee la pregunta', false);
  $('stepNote').textContent = 'La grabación comenzará automáticamente en unos segundos.';
  $('qControls').innerHTML = `<button class="btn" onclick="runPrepPhase()">Estoy listo(a) →</button>`;
  countdown(secs, (left)=>{ setStageTimer(left); }, ()=>{ runPrepPhase(); });
}
function runPrepPhase(){
  clearTimeout(phaseTimer);
  const secs = (KIT.settings&&KIT.settings.prepSecs)||25;
  paintStageBadge('Prepárate', false);
  $('stepNote').textContent = 'Tu respuesta comenzará a grabarse cuando termine este conteo.';
  $('qControls').innerHTML = `<button class="btn" onclick="runRecordPhase()">Grabar ahora →</button>`;
  countdown(secs, (left)=>{ setStageTimer(left); }, ()=>{ runRecordPhase(); });
}
function runRecordPhase(){
  clearTimeout(phaseTimer);
  const isPractice = state.qIndex === -1;
  const secs = isPractice ? 20 : ((KIT.settings&&KIT.settings.answerSecs)||60);
  paintStageBadge('Grabando', true);
  $('stepNote').textContent = 'Puedes detener la grabación antes si ya terminaste.';
  $('qControls').innerHTML = `<button class="btn danger" onclick="stopRecording()">⏹ Detener grabación</button>`;
  startRecording();
  countdown(secs, (left)=>{ setStageTimer(left); }, ()=>{ stopRecording(); });
}

let countdownInterval = null;
function countdown(total, onTick, onDone){
  let left = total;
  onTick(left);
  clearInterval(countdownInterval);
  countdownInterval = setInterval(()=>{
    left--;
    onTick(left);
    if(left<=0){ clearInterval(countdownInterval); onDone(); }
  },1000);
}
function paintStageBadge(label, recording){
  const stage = $('stage');
  if(!stage) return;
  let badge = stage.querySelector('.badge');
  if(!badge){ badge = document.createElement('div'); badge.className='badge'; stage.appendChild(badge); }
  badge.className = 'badge'+(recording?' rec':'');
  badge.innerHTML = `<span class="dot"></span>${esc(label)}`;
  let timer = stage.querySelector('.timer');
  if(!timer){ timer = document.createElement('div'); timer.className='timer'; stage.appendChild(timer); }
}
function setStageTimer(left){
  const stage = $('stage');
  if(!stage) return;
  const timer = stage.querySelector('.timer');
  if(timer) timer.textContent = left+'s';
}

function pickRecordSource(){
  if(state.bg==='none') return cameraStream;
  if(canvasEl && canvasEl.captureStream){
    const cs = canvasEl.captureStream(24);
    const audioTracks = cameraStream.getAudioTracks();
    return new MediaStream([...cs.getVideoTracks(), ...audioTracks]);
  }
  return cameraStream; // fallback if captureStream unsupported
}
function pickMimeType(){
  const options = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
  for(const o of options){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(o)) return o; }
  return '';
}
function startRecording(){
  recordedChunks = [];
  currentRecordStream = pickRecordSource();
  const mime = pickMimeType();
  try{
    recorder = mime ? new MediaRecorder(currentRecordStream, {mimeType:mime}) : new MediaRecorder(currentRecordStream);
  }catch(e){
    $('qErr').textContent = 'Tu navegador no soporta grabación de video. Intenta con Chrome actualizado.';
    return;
  }
  recorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
  recorder.onstop = onRecordingStopped;
  recorder.start();
}
function stopRecording(){
  clearInterval(countdownInterval);
  clearTimeout(phaseTimer);
  if(recorder && recorder.state!=='inactive') recorder.stop();
}
function onRecordingStopped(){
  const blob = new Blob(recordedChunks, {type: recordedChunks[0]?recordedChunks[0].type:'video/webm'});
  renderReview(blob);
}

function renderReview(blob){
  const url = URL.createObjectURL(blob);
  const isPractice = state.qIndex===-1;
  const canRetry = state.attempts < (maxAttempts()-1);
  app().innerHTML = `
    <div class="qbox"><span class="qnum">${isPractice?'Práctica':('Pregunta '+(state.qIndex+1)+' de '+QUESTIONS.length)}</span><span class="qtext">Revisa tu respuesta</span></div>
    <div class="stage"><video controls src="${url}" style="width:100%;height:100%;object-fit:cover"></video></div>
    <div class="btnrow" style="justify-content:center">
      ${canRetry ? `<button class="btn sec" onclick="retryQuestion()">${ic('repeat',15)} Repetir</button>` : ''}
      <button class="btn" style="flex:1" onclick="acceptAnswer()">${isPractice?'Continuar a las preguntas →':'Usar esta respuesta →'}</button>
    </div>
    <div class="step-note">${canRetry ? ('Puedes repetir hasta '+(maxAttempts()-1-state.attempts)+' vez(es) más.') : 'Ya usaste todos tus intentos para esta respuesta.'}</div>`;
  renderReview._blob = blob;
}
function retryQuestion(){
  state.attempts++;
  render('question');
}
function acceptAnswer(){
  const blob = renderReview._blob;
  if(state.qIndex === -1){
    state.practiceDone = true;
    state.qIndex = 0;
    state.attempts = 0;
    render('question');
    return;
  }
  const q = QUESTIONS[state.qIndex];
  state.answers.push({order:q.order||(state.qIndex+1), question:q.text, lang:state.lang, blob});
  if(state.qIndex < QUESTIONS.length-1){
    state.qIndex++;
    state.attempts = 0;
    render('question');
  } else {
    stopCamera();
    render('uploading');
    uploadAll();
  }
}

// ---------------- UPLOAD & SUBMIT ----------------
function renderUploading(){
  app().innerHTML = `
    <div class="card" style="text-align:center">
      <div class="spinner"></div>
      <h2>Enviando tus respuestas…</h2>
      <p class="lead" id="uplStatus">Esto puede tardar un momento, no cierres esta ventana.</p>
      <div class="progwrap"><div class="prog"><i id="uplBar" style="width:0%"></i></div></div>
    </div>`;
}
async function uploadAll(){
  const results = [];
  const total = state.answers.length;
  for(let i=0;i<total;i++){
    const a = state.answers[i];
    $('uplStatus').textContent = `Subiendo respuesta ${i+1} de ${total}…`;
    $('uplBar').style.width = Math.round((i/total)*100)+'%';
    try{
      const ext = (a.blob.type||'').includes('mp4') ? 'mp4' : 'webm';
      const path = `${KIT.position_id}/${KIT.kit_id}/${Date.now()}_${state.candidate.email.replace(/[^a-z0-9]/gi,'_')}_q${a.order}.${ext}`;
      const {error} = await sb.storage.from('interview-videos').upload(path, a.blob, {contentType:a.blob.type||'video/webm', upsert:false});
      if(error) throw error;
      const {data:pub} = sb.storage.from('interview-videos').getPublicUrl(path);
      results.push({order:a.order, question:a.question, lang:a.lang, url:pub.publicUrl});
    }catch(e){
      $('uplStatus').textContent = 'Hubo un problema subiendo tu video, reintentando…';
      i--; // simple retry same index
      await new Promise(r=>setTimeout(r,1500));
    }
  }
  $('uplBar').style.width='100%';
  $('uplStatus').textContent = 'Guardando tu entrevista…';
  try{
    const {data, error} = await sb.rpc('submit_interview_public', {
      p_kit_id: KIT.kit_id,
      p_candidate_name: state.candidate.name,
      p_candidate_email: state.candidate.email,
      p_candidate_phone: state.candidate.phone||null,
      p_answers: results,
      p_source_ref: 'weai-video-interviews-app'
    });
    if(error) throw error;
    if(!data || !data.ok) throw new Error((data&&data.message)||'No se pudo guardar tu entrevista.');
    // Dispara la transcripción (detecta español/inglés automáticamente) en segundo plano —
    // no bloquea la pantalla de agradecimiento del candidato si tarda o falla.
    if(data.id){
      fetch(SUPABASE_URL + '/functions/v1/transcribe-submission', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ submission_id: data.id })
      }).catch(()=>{});
    }
    render('done');
  }catch(e){
    app().innerHTML = `<div class="gate-center"><div><div class="big" style="color:var(--orange,#F07E2E)">${ic('warn',44)}</div><h2>No se pudo guardar tu entrevista</h2><p class="lead">Error: ${esc(e.message||e)}. Por favor contacta a tu reclutador.</p></div></div>`;
  }
}

function renderDone(){
  app().innerHTML = `
    <div class="gate-center"><div>
      <div class="big" style="color:var(--green,#1EA672)">${ic('check',44)}</div>
      <h2>¡Listo, ${esc(state.candidate.name.split(' ')[0]||'')}!</h2>
      <p class="lead">Tu video-entrevista fue enviada correctamente. Nuestro equipo de reclutamiento la revisará y se pondrá en contacto contigo si avanzas al siguiente paso.</p>
      <p class="lead">Gracias por tu tiempo.</p>
    </div></div>`;
}
</script>
